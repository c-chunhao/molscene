[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "molscene"
version = "0.4.0"
description = "Native PyMOL workbench, reproducible molecular scenes and structural analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Chunhao Cao"}]

[project.optional-dependencies]
test = ["Pillow>=10"]
build = ["build[uv]>=1.2", "twine>=6"]
gui = ["PySide6-Essentials==6.8.1"]

[project.urls]
Repository = "https://github.com/c-chunhao/molscene"
Issues = "https://github.com/c-chunhao/molscene/issues"

[project.scripts]
molscene = "molscene.cli:main"

[tool.setuptools.packages.find]
include = ["molscene*"]

[tool.setuptools.data-files]
"share/molscene/examples/data" = ["examples/data/1ubq.pdb", "examples/data/1ubq.cif", "examples/data/1hsg.pdb", "examples/data/sources.json"]
