name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original tool only
        run: python -m pip install -e .
      - name: Test without a PyMOL backend
        shell: bash
        run: |
          set -e -o pipefail
          python - <<'PY' 2>&1 | tee unit-diagnostics.txt
          import unittest
          from pathlib import Path
          # Only the runner writes status; test diagnostics use the separate log.
          with Path('unit-tests.txt').open('x', encoding='utf-8') as status:
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(stream=status, verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Require actual Windows NTFS junction and hardlink safeguards
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path('unit-tests.txt').read_text(encoding='utf-8')
          for name in ('test_windows_junction_rejected_without_traversal',
                       'test_hardlink_alias_rejected_without_source_damage'):
              case = r'test_bundles\.BundleTests(?:\.' + re.escape(name) + r')?'
              assert re.search(r'^' + re.escape(name) + r' \(' + case + r'\) \.\.\. ok$', log, re.M), name + ' must execute on NTFS'
          PY
      - name: Upload plain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plain-${{ matrix.os }}-${{ matrix.python }}
          path: |
            unit-tests.txt
            unit-diagnostics.txt

  integration:
    name: Required PyMOL + native Qt OpenGL / Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e -o pipefail -l {0}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: xcb
      MOLSCENE_TEST_ARTIFACTS: artifacts/native-workbench
      MOLSCENE_REQUIRE_ADVANCED: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      # See https://github.com/mamba-org/setup-micromamba for official inputs.
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: molscene-ci
          create-args: >-
            -c conda-forge
            python=3.11
            pymol-open-source>=3.1,<3.3
            pillow
            pyqt=5
            apbs=3.4.1=py311ha92c01f_1
            ffmpeg
            pip
          init-shell: bash
          cache-environment: true
          post-cleanup: all
      - name: Install headless display support
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install MolScene
        run: python -m pip install -e .
      - name: Install independent PDB2PQR Python 3.11 environment
        run: |
          mkdir -p artifacts/pdb2pqr-wheels
          python -m venv --copies .ci-pdb2pqr
          .ci-pdb2pqr/bin/python -m pip --log artifacts/pdb2pqr-download.log download --only-binary=:all: --dest artifacts/pdb2pqr-wheels pdb2pqr==3.7.1
          .ci-pdb2pqr/bin/python -m pip install --no-index --find-links artifacts/pdb2pqr-wheels pdb2pqr==3.7.1
          .ci-pdb2pqr/bin/python -m pip freeze --all > artifacts/pdb2pqr-freeze.txt
          .ci-pdb2pqr/bin/python -m pip inspect > artifacts/pdb2pqr-inspect.json
          sha256sum artifacts/pdb2pqr-wheels/* > artifacts/pdb2pqr-wheel-sha256.txt
      - name: Record resolved backend and assert Python PyMOL and Qt5
        run: |
          mkdir -p artifacts
          micromamba list > artifacts/environment.txt
          micromamba list --explicit > artifacts/conda-explicit.txt
          python - <<'PY' | tee artifacts/backend.txt
          import json, re, sys
          from pathlib import Path
          import pymol2
          from PIL import Image
          from pymol.Qt import QtCore, QtWidgets, PYQT_NAME
          assert sys.version_info[:2] == (3, 11), sys.version
          assert QtCore.qVersion().startswith('5.'), (PYQT_NAME, QtCore.qVersion())
          assert 'pyqt5' in PYQT_NAME.lower(), PYQT_NAME
          with pymol2.PyMOL() as instance:
              version = instance.cmd.get_version()[0]
          assert re.match(r'^3\.[12](?:\.|$)', version), version
          records = []
          for path in sorted(Path(sys.prefix, 'conda-meta').glob('*.json')):
              record = json.loads(path.read_text())
              records.append({key: record.get(key) for key in
                  ('name', 'version', 'build', 'subdir', 'url', 'md5', 'sha256')})
          apbs = [record for record in records if record['name'] == 'apbs']
          assert len(apbs) == 1 and apbs[0]['version'] == '3.4.1' and apbs[0]['build'] == 'py311ha92c01f_1', apbs
          assert all(record['url'] and (record['sha256'] or record['md5']) for record in records), 'Missing resolved package URL/hash'
          Path('artifacts/conda-packages.json').write_text(json.dumps(records, indent=2) + '\n')
          print(sys.version)
          print('PyMOL', version, 'binding', PYQT_NAME, 'Qt', QtCore.qVersion())
          PY
          xvfb-run -a python -m molscene doctor | tee artifacts/doctor.txt
      - name: Configure actual regular tool paths and verify external interpreter
        run: |
          .ci-pdb2pqr/bin/python - <<'PY' > artifacts/pdb2pqr-runtime.json
          import importlib.metadata, json, struct, sys
          from pathlib import Path
          assert sys.version_info >= (3, 11)
          assert importlib.metadata.version('pdb2pqr') == '3.7.1'
          distribution = importlib.metadata.distribution('pdb2pqr')
          metadata = next(distribution.locate_file(file).resolve(strict=True)
              for file in distribution.files if str(file).endswith('.dist-info/METADATA'))
          print(json.dumps({'executable': str(Path(sys.executable).resolve(strict=True)),
              'metadata': str(metadata), 'prefix': str(Path(sys.prefix).resolve(strict=True)), 'python': sys.version, 'bits': struct.calcsize('P') * 8}))
          PY
          python scripts/prepare_ci_tools.py
      - name: Assert actual tools architecture version and H264 encoder
        run: |
          python -m molscene tools --config "$MOLSCENE_TOOLS_CONFIG" | tee artifacts/tools-probe.json
          ffmpeg -hide_banner -encoders > artifacts/ffmpeg-encoders.txt 2>&1
          python - <<'PY'
          import json, re
          from pathlib import Path
          result = json.loads(Path('artifacts/tools-probe.json').read_text())
          assert result['passed'] is True
          assert set(result['tools']) == {'apbs', 'pdb2pqr', 'ffmpeg', 'ffprobe'}
          assert all(item['available'] for item in result['tools'].values())
          assert re.search(r'^\s*V\S*\s+libx264\s', Path('artifacts/ffmpeg-encoders.txt').read_text(), re.M), 'Real libx264 is required'
          PY
      - name: Require desktop test dependencies
        run: python -c "import runpy; tests = runpy.run_path('tests/test_desktop.py'); assert tests['HAS_PYMOL'] and tests['HAS_QT'], 'Required native tests cannot skip for missing dependencies'"
      - name: Run full test suite with real PyMOL
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 +extension GLX' python - <<'PY' 2>&1 | tee artifacts/tests.txt
          import unittest
          from pathlib import Path
          # Backend/PID/native diagnostics stay on stdout/stderr. Only the
          # runner writes status, so diagnostics cannot split or spoof an ok.
          with Path('artifacts/tests-status.txt').open('x', encoding='utf-8') as status:
              suite = unittest.defaultTestLoader.discover('tests')
              result = unittest.TextTestRunner(stream=status, verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      # The full suite already invokes the real harness normally and with clean
      # preferences. Require actual execution, without repeating the same runs.
      - name: Require native GL, mouse, pick and lifecycle tests to have passed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path('artifacts/tests-status.txt').read_text(encoding='utf-8')
          required = {
              'test_native_startup_events_framebuffer_and_shutdown': 'test_desktop.NativeDesktopTests',
              'test_native_clean_preferences_startup_and_shutdown': 'test_desktop.NativeDesktopTests',
              'test_native_fixtures_exports_and_cooperative_window_close': 'test_workbench.QtWorkbenchTests',
              'test_native_navigation_presets_and_interface_workflow': 'test_navigation_gui.NativeNavigationTests',
              'test_native_advanced_timeline_density_potential_and_close': 'test_advanced_gui.AdvancedNativeTests',
              'test_native_daily_polar_labels_exports_and_narrow_navigation': 'test_daily_gui.NativeDailyTests',
              'test_real_3c70_bundle_reloads_all_world_geometry': 'test_assembly_export.NativeAssemblyExportTests',
              'test_dcd_bundle_replay_all_native_states_then_stride': 'test_trajectory_export.ExportTests',
              'test_isolated_molecular_controls': 'test_molecular_gui.MolecularGuiTests',
              'test_native_assemblies_trajectory_and_close': 'test_molecular_gui.NativeMolecularTests',
              'test_native_volume_frames_and_cancel_cleanup': 'test_native_render.NativeRenderTests',
              'test_registered_density_relocated_replay': 'test_density_engine.DensityEngineTests',
              'test_real_h264_frame_count_and_duration': 'test_animation.AnimationEncoderTests',
              'test_relocated_timeline_replay_without_molscene': 'test_animation.AnimationReplayTests',
              'test_real_apbs_uniform_sign_dielectric_translation_convergence': 'test_electrostatics_real.RealElectrostaticsTests',
              'test_real_apbs_born_dielectric_boundary': 'test_electrostatics_real.RealElectrostaticsTests',
              'test_real_pdb2pqr_ubiquitin_surface_and_replay': 'test_electrostatics_real.RealElectrostaticsTests',
          }
          for name, case in required.items():
              assert re.search(r'^' + re.escape(name) + r' \(' + re.escape(case) + r'(?:\.' + re.escape(name) + r')?\) \.\.\. ok$', log, re.M), name + ' must execute successfully, not skip'
          PY
      - name: Require actual Linux no-replace links and process lifetime proofs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path('artifacts/tests-status.txt').read_text(encoding='utf-8')
          required = {
              'test_publish_exact_inventory_hashes_and_empty_log': 'test_bundles.BundleTests',
              'test_nested_symlink_rejected_and_cleanup_preserves_target': 'test_bundles.BundleTests',
              'test_hardlink_alias_rejected_without_source_damage': 'test_bundles.BundleTests',
              'test_destination_created_between_check_and_rename_is_not_replaced': 'test_bundles.BundleTests',
              'test_timeout_reaps_child_and_grandchild': 'test_external_tools.ExternalToolsTests',
              'test_cancellation_during_run_reaps_descendants': 'test_external_tools.ExternalToolsTests',
              'test_forced_worker_death_reaps_descendants': 'test_external_tools.ExternalToolsTests',
              'test_forced_guardian_death_reaps_descendants': 'test_external_tools.ExternalToolsTests',
          }
          for name, case in required.items():
              assert re.search(r'^' + re.escape(name) + r' \(' + re.escape(case) + r'(?:\.' + re.escape(name) + r')?\) \.\.\. ok$', log, re.M), name + ' must execute on Linux'
          PY
      - name: Run offline selftest
        run: xvfb-run -a python -m molscene selftest --output artifacts/selftest 2>&1 | tee artifacts/selftest.txt
      - name: Run complete advanced examples with actual solvers
        run: xvfb-run -a python examples/reproduce_v04.py --tools "$MOLSCENE_TOOLS_CONFIG" --output artifacts/gallery-v04 2>&1 | tee artifacts/gallery-v04.txt
      - name: Run offline daily examples with CPU ray
        run: xvfb-run -a python examples/reproduce_v05.py --output artifacts/gallery-v05 2>&1 | tee artifacts/gallery-v05.txt
      - name: Run offline assembly and trajectory examples
        run: python examples/reproduce_v06.py --output artifacts/gallery-v06 2>&1 | tee artifacts/gallery-v06.txt
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opensource-qt-integration
          path: |
            artifacts/
            !artifacts/pdb2pqr-wheels/**
          if-no-files-found: ignore
