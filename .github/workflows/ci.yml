name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original tool only
        run: python -m pip install -e .
      - name: Test without a PyMOL backend
        run: python -m unittest discover -s tests -v

  integration:
    name: Open-source PyMOL / Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e -o pipefail -l {0}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      # See https://github.com/mamba-org/setup-micromamba for official inputs.
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: molscene-ci
          create-args: >-
            -c conda-forge
            python=3.10
            pymol-open-source
            pillow
            pip
          init-shell: bash
          cache-environment: true
          post-cleanup: all
      - name: Install headless display support
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1 libegl1
      - name: Install MolScene
        run: python -m pip install -e .
      - name: Record resolved backend and assert import
        run: |
          mkdir -p artifacts
          micromamba list > artifacts/environment.txt
          python -c "import sys, pymol2; print(sys.version); print(pymol2.__file__)" | tee artifacts/backend.txt
          xvfb-run -a python -m molscene doctor | tee artifacts/doctor.txt
      - name: Run full test suite with real PyMOL
        run: xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee artifacts/tests.txt
      - name: Run offline selftest
        run: xvfb-run -a python -m molscene selftest --output artifacts/selftest 2>&1 | tee artifacts/selftest.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opensource-integration-failure
          path: artifacts/
          if-no-files-found: ignore
