name: Bug report
description: Report a reproducible CLI, analysis, rendering, or portability problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use public or synthetic structures. Review logs and attachments for private coordinates, credentials, license material, and personal paths."
  - type: textarea
    id: command
    attributes:
      label: Minimal command and input
      description: Include exact selection strings and a public structure ID or minimal synthetic reproducer.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the error, relevant report fields, or an image if useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and doctor output
      description: OS, Python, MolScene revision/version, PyMOL distribution/version, and sanitized doctor output.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests or selftest result
      description: Include the command and summary, including skipped tests, if available.
